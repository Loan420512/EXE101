version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL cho quản trị và lưu trữ người chơi
  postgres:
    image: postgres:16-alpine
    container_name: ngucung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngucung
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Dịch vụ Realtime WebSocket độc lập
  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    container_name: ngucung-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
