name: Ngũ Cung CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    name: Kiểm thử & Đảm bảo chất lượng (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci --legacy-peer-deps

      - name: Kiểm tra kiểu dữ liệu TypeScript (Strict)
        run: npx tsc --noEmit

      - name: Chạy kiểm thử đơn vị & mô phỏng luật chơi (Vitest)
        run: npm test

      - name: Build ứng dụng Next.js
        run: npm run build
